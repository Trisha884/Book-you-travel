<html>
<head>
    <title>Travel Booking</title>

    <style>
        header {
            text-align: center;
            padding: 30px;
            background-color: rgb(192, 179, 179);
        }

        .home-button {
            text-align: left;
            padding: 20px;
        }

        .home-button a {
            text-decoration: none;
            color: rgb(115, 104, 104);
            background-color: rgb(172, 208, 187);
            padding: 8px 15px;
            border-radius: 5px;
        }

        .form-container {
            width: 60%;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid rgb(164, 160, 160);
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            margin-bottom: 5px;
            margin-right:5px;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid rgb(210, 240, 198);
            border-radius: 5px;
        }

        .submit-button {
            text-align: center;
            margin-top: 20px;
        }

        .submit-button input {
            background-color: #8bb9a6;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background-color: rgb(170, 230, 233);
        }
    </style>
</head>

<body>

    <header>
        <h1 style="margin-bottom: 10px;">Travel Booking</h1>
        <p>Fill in your details to plan your trip.</p>
    </header>

    <div class="home-button">
        <a href="home.html">Home</a>
    </div>

    <div class="form-container">

        <h2 style=" text-align: center; margin-bottom: 25px;">Book Your Travel</h2>

        <form>

            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label>Destination</label>
                <select>
                    <option>Select Destination</option>
                    <option>Manali</option>
                    <option>Goa</option>
                    <option>Kerala</option>
                    <option>Rajasthan</option>
                    <option>Ladakh</option>
                </select>
            </div>

            <div class="form-group">
                <label>Travel Date</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Health Conditions</label>
                <input type="text" placeholder="Mention any health conditions if applicable"></input>
            </div>

            <div class="submit-button">
                <input type="submit" placeholder="Confirm Booking">
            </div>

        </form>

    </div>

    <footer>
        <p>Thank you for choosing us for your travel!</p>
    </footer>

</body>
</html>
